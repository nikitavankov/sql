---
- name: Copy EPEL GPG key to target
  ansible.builtin.copy:
    src: "{{ repository_epel_gpg_key }}"
    dest: "/etc/pki/rpm-gpg/{{ repository_epel_gpg_key }}"
    owner: root
    group: root
    mode: "0644"

- name: Import EPEL GPG key
  ansible.builtin.rpm_key:
    state: present
    key: "/etc/pki/rpm-gpg/{{ repository_epel_gpg_key }}"

- name: Copy EPEL release RPM to target
  ansible.builtin.copy:
    src: "{{ repository_epel_rpm }}"
    dest: "{{ repository_staging_dir }}/{{ repository_epel_rpm }}"
    owner: root
    group: root
    mode: "0644"

- name: Install EPEL release from local file
  ansible.builtin.dnf:
    name: "{{ repository_staging_dir }}/{{ repository_epel_rpm }}"
    state: present
    disable_gpg_check: false
    disablerepo: "{{ repository_disable_repos }}"
